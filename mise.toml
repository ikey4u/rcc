# RCC developer and release tasks. List them with `mise tasks`.
#
# Pinned LLVM/musl/glibc archives are downloaded into .cache/ (gitignored).
# The LLVM engine work tree still lives in inner/ so later release builds
# can reuse a finished compile:
#   mise release
#     -> fetches archives into .cache/
#     -> dist/bin/{cargo-rcc,rcc}
#     -> dist/rcc-{os}-{arch}-{version}.zip
#   mise run build:release -- \
#     .cache/LLVM-22.1.8-macOS-ARM64.tar.xz \
#     .cache/llvm-project-22.1.8.src.tar.xz \
#     .cache/musl-1.2.5.tar.gz \
#     /absolute/path/to/new-output-directory

min_version = "2024.11.1"

[tools]
# Cargo.toml enforces 1.85 as the MSRV; use the current stable toolchain for
# normal development, including rustfmt and clippy.
rust = { version = "stable", components = "rustfmt,clippy" }

[tasks."fetch:archives"]
description = "Download pinned LLVM, musl, and CentOS 7 glibc RPM archives into .cache/"
run = "./scripts/fetch-pinned-archives.sh"

[tasks.fetch]
description = "Fetch the locked Rust dependency graph"
run = "cargo fetch --locked"

[tasks.build]
description = "Build the development workspace (not the distributable static-engine release)"
run = "cargo build --workspace --locked"

[tasks."build:pack"]
description = "Build the release rcc-pack utility"
run = "cargo build --release --locked -p rcc-pack"

[tasks."build:release"]
description = "Build the static macOS AArch64 release with musl-static and, when RPMs are present, gnu-glibc217"
depends = ["fetch"]
# These are build-host tools only. The resulting rcc binary does not depend on
# CMake, Ninja, or a system C/C++ compiler at runtime.
tools = { cmake = "4.4.3", ninja = "1.13.1" }
run = "./scripts/build-macos-arm64-release.sh"

[tasks.release]
description = "Build cargo-rcc, stage rcc + cargo-rcc into dist/bin, and zip dist/rcc-{os}-{arch}-{version}.zip"
depends = ["fetch"]
# cmake/ninja are only used if dist/rcc-release/rcc is missing and this task
# falls back to build-macos-arm64-release.sh.
tools = { cmake = "4.4.3", ninja = "1.13.1" }
run = "./scripts/package-release.sh"

[tasks.format]
description = "Format all Rust code"
run = "cargo fmt --all"

[tasks."format:check"]
description = "Check Rust formatting without modifying files"
run = "cargo fmt --all -- --check"

[tasks."lima:x64"]
description = "Start the x86_64 Alpine Lima VM used to execute linux musl binaries on Apple Silicon"
run = "./scripts/ensure-linux-x86_64-guest.sh"

[tasks."verify:linux-musl"]
description = "Compile C and cargo-rcc native stacks for linux-x86_64-musl-static and verify hermetic ELF artifacts"
run = "./scripts/verify-linux-x86_64-musl.sh"

[tasks."test:linux-musl"]
description = "Compile, verify, and run linux-x86_64-musl-static binaries (starts Lima on macOS)"
run = '''
rustup target add x86_64-unknown-linux-musl
./scripts/ensure-linux-x86_64-guest.sh
RCC_REQUIRE_RUNTIME=1 ./scripts/verify-linux-x86_64-musl.sh
'''

[tasks."lima:glibc217"]
description = "Start the x86_64 CentOS 7 Lima VM used to execute linux gnu glibc 2.17 binaries"
run = "./scripts/ensure-linux-x86_64-glibc-guest.sh"

[tasks."verify:linux-glibc"]
description = "Compile C and cargo-rcc native stacks for linux-x86_64-gnu-glibc217 and verify GLIBC_ <= 2.17"
run = "./scripts/verify-linux-x86_64-gnu.sh"

[tasks."test:linux-glibc"]
description = "Compile, verify, and run linux-x86_64-gnu-glibc217 binaries (starts CentOS 7 Lima on macOS)"
run = '''
rustup target add x86_64-unknown-linux-gnu
./scripts/ensure-linux-x86_64-glibc-guest.sh
RCC_REQUIRE_RUNTIME=1 ./scripts/verify-linux-x86_64-gnu.sh
'''

[tasks.test]
description = "Run the workspace test suite"
run = "cargo test --workspace --locked"

[tasks.lint]
description = "Run Clippy with warnings treated as errors"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks."metadata:check"]
description = "Validate release scripts and pinned LLVM/musl/glibc lock files"
run = '''
sh -n scripts/build-macos-arm64-release.sh
sh -n scripts/package-release.sh
sh -n scripts/stage-llvm-macos-arm64.sh
sh -n scripts/stage-linux-x86_64-libcxx.sh
sh -n scripts/stage-linux-x86_64-musl.sh
sh -n scripts/stage-linux-x86_64-gnu-glibc217.sh
sh -n scripts/fetch-pinned-archives.sh
sh -n scripts/verify-linux-x86_64-musl.sh
sh -n scripts/verify-linux-x86_64-gnu.sh
sh -n scripts/ensure-linux-x86_64-guest.sh
sh -n scripts/ensure-linux-x86_64-glibc-guest.sh
sh -n scripts/repack-linux-x86_64-gnu-glibc217.sh
sh -n examples/libcap-ng-linux/stage.sh
python3 -m json.tool examples/libcap-ng-linux/libcap-ng-0.8.5.lock.json >/dev/null
python3 -m json.tool toolchains/llvm-22.1.8-macos-arm64.lock.json >/dev/null
python3 -m json.tool toolchains/llvm-project-22.1.8-source.lock.json >/dev/null
python3 -m json.tool toolchains/musl-1.2.5.lock.json >/dev/null
python3 -m json.tool toolchains/glibc-2.17-centos7-runtime.lock.json >/dev/null
python3 -m json.tool toolchains/glibc-headers-2.17-centos7.lock.json >/dev/null
python3 -m json.tool toolchains/glibc-devel-2.17-centos7.lock.json >/dev/null
python3 -m json.tool toolchains/kernel-headers-3.10-centos7.lock.json >/dev/null
'''

[tasks.check]
description = "Run formatting, tests, lint, and release-metadata checks"
run = '''
cargo fmt --all -- --check
cargo test --workspace --locked
cargo clippy --workspace --all-targets --locked -- -D warnings
sh -n scripts/build-macos-arm64-release.sh
sh -n scripts/package-release.sh
sh -n scripts/stage-llvm-macos-arm64.sh
sh -n scripts/stage-linux-x86_64-libcxx.sh
sh -n scripts/stage-linux-x86_64-musl.sh
sh -n scripts/stage-linux-x86_64-gnu-glibc217.sh
sh -n scripts/fetch-pinned-archives.sh
sh -n scripts/verify-linux-x86_64-musl.sh
sh -n scripts/verify-linux-x86_64-gnu.sh
sh -n scripts/ensure-linux-x86_64-guest.sh
sh -n scripts/ensure-linux-x86_64-glibc-guest.sh
sh -n scripts/repack-linux-x86_64-gnu-glibc217.sh
sh -n examples/libcap-ng-linux/stage.sh
python3 -m json.tool examples/libcap-ng-linux/libcap-ng-0.8.5.lock.json >/dev/null
python3 -m json.tool toolchains/llvm-22.1.8-macos-arm64.lock.json >/dev/null
python3 -m json.tool toolchains/llvm-project-22.1.8-source.lock.json >/dev/null
python3 -m json.tool toolchains/musl-1.2.5.lock.json >/dev/null
python3 -m json.tool toolchains/glibc-2.17-centos7-runtime.lock.json >/dev/null
python3 -m json.tool toolchains/glibc-headers-2.17-centos7.lock.json >/dev/null
python3 -m json.tool toolchains/glibc-devel-2.17-centos7.lock.json >/dev/null
python3 -m json.tool toolchains/kernel-headers-3.10-centos7.lock.json >/dev/null
'''
