# RCC developer and release tasks. List them with `mise tasks`.
#
# Pinned LLVM/musl/glibc archives are downloaded into .cache/ (gitignored).
# The LLVM engine work tree still lives in inner/ so later release builds
# can reuse a finished compile:
#   mise setup
#     -> cargo fetch --locked
#     -> pinned LLVM/musl/glibc/mingw archives into .cache/
#     -> linux guest runtimes on macOS (Homebrew qemu-system + Lima)
#   mise check
#     -> rustfmt --check, cargo test, clippy, script/lock metadata
#     -> product verify scripts when a release rcc is present
#   mise release
#     -> fetches archives into .cache/
#     -> always rebuilds cargo-rcc and rcc (LLVM engine reused if present)
#     -> dist/bin/{cargo-rcc,rcc}
#     -> dist/rcc-{os}-{arch}-{version}.zip
#   mise run release:install
#     -> mise release
#     -> copy dist/bin/{cargo-rcc,rcc} to INSTALL_DIR (default ~/.cargo/bin)
#   mise run build:release -- \
#     .cache/LLVM-22.1.8-macOS-ARM64.tar.xz \
#     .cache/llvm-project-22.1.8.src.tar.xz \
#     .cache/musl-1.2.5.tar.gz \
#     /absolute/path/to/new-output-directory

min_version = "2024.11.1"

[tools]
# Cargo.toml enforces 1.85 as the MSRV; use the current stable toolchain for
# normal development, including rustfmt and clippy.
rust = { version = "stable", components = "rustfmt,clippy" }

[tasks.setup]
description = "cargo fetch, pinned archives, and macOS linux guest VMs (qemu/Lima)"
run = "./scripts/setup.sh"

[tasks.build]
description = "Build the development workspace (not the distributable static-engine release)"
run = "cargo build --workspace --locked"

[tasks."build:release"]
description = "Same as mise release: rebuild cargo-rcc and rcc into dist/bin"
# These are build-host tools only. The resulting rcc binary does not depend on
# CMake, Ninja, or a system C/C++ compiler at runtime.
tools = { cmake = "4.4.3", ninja = "1.13.1" }
run = "./scripts/package-release.sh"

[tasks.release]
description = "Rebuild cargo-rcc and rcc, stage them into dist/bin, and zip dist/rcc-{os}-{arch}-{version}.zip"
# Always relinks rcc. cmake/ninja are only used if the LLVM engine work tree
# is missing and this task falls back to build-macos-arm64-release.sh.
tools = { cmake = "4.4.3", ninja = "1.13.1" }
run = "./scripts/package-release.sh"

[tasks."release:install"]
description = "mise release, then copy dist/bin/{rcc,cargo-rcc} into INSTALL_DIR (default ~/.cargo/bin; DESTDIR prepended)"
depends = ["release"]
run = "./scripts/install.sh"

[tasks.format]
description = "Format all Rust code"
run = "cargo fmt --all"

[tasks.check]
description = "rustfmt check, cargo test, clippy, script/lock metadata; product verify scripts when a release rcc is present"
run = "./scripts/check.sh"
