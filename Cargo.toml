[workspace]
members = [
    "crates/rcc-core",
    "crates/rcc",
    "crates/rcc-pack",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ikey4u/rcc"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.28", features = ["derive", "env"] }
fs2 = "0.4.3"
hex = "0.4.3"
lz4_flex = "0.13.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tempfile = "3.27.0"
walkdir = "2.5.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
