<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="RCC architecture diagram">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- frame -->
  <rect x="8" y="8" width="944" height="644" rx="16" fill="#FBFCFD" stroke="#E5E9F0" stroke-width="1.5"/>

  <!-- title -->
  <text x="32" y="46" font-size="20" font-weight="600" fill="#0F172A">RCC architecture</text>

  <!-- legend -->
  <line x1="648" y1="33" x2="684" y2="33" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="692" y="37" font-size="11.5" fill="#475569">build flow</text>
  <line x1="792" y1="33" x2="828" y2="33" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="836" y="37" font-size="11.5" fill="#475569">runtime discovery</text>

  <!-- ===== connectors (drawn first, under the boxes' labels) ===== -->
  <!-- invocation -> controller -->
  <line x1="480" y1="140" x2="480" y2="184" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- profiles -> controller -->
  <line x1="226" y1="227" x2="268" y2="227" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- overlays -> controller -->
  <line x1="226" y1="305" x2="268" y2="305" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- external SDKs -> controller (runtime, dashed) -->
  <line x1="734" y1="266" x2="692" y2="266" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="710" y="252" font-size="10" fill="#64748B" text-anchor="middle">runtime</text>
  <!-- pack -> cache -->
  <line x1="325" y1="439" x2="433" y2="439" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="379" y="432" font-size="10" fill="#475569" text-anchor="middle">SHA-256 verify</text>
  <!-- controller -> cache (materialize) -->
  <line x1="512" y1="338" x2="512" y2="402" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="374" font-size="9.5" fill="#475569">materialize</text>
  <!-- cache -> controller (serve view) -->
  <line x1="470" y1="402" x2="470" y2="338" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="464" y="374" font-size="9.5" fill="#475569" text-anchor="end">view</text>
  <!-- controller -> output (right L-route) -->
  <path d="M690,300 H770 V588 H602" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="779" y="430" font-size="10" fill="#475569">no system</text>
  <text x="779" y="444" font-size="10" fill="#475569">clang / gcc / ld</text>

  <!-- ===== nodes ===== -->
  <!-- invocation -->
  <rect x="270" y="84" width="420" height="56" rx="12" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="480" y="107" font-size="12.5" fill="#1E3A8A" text-anchor="middle">cc · cxx · ld.lld / ld64.lld / lld-link · ar · ranlib</text>
  <text x="480" y="125" font-size="11" fill="#64748B" text-anchor="middle">hardlink aliases of rcc</text>

  <!-- controller -->
  <rect x="270" y="186" width="420" height="150" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
  <text x="480" y="212" font-size="14" font-weight="600" fill="#3730A3" text-anchor="middle">rcc — single static multicall binary</text>
  <rect x="288" y="230" width="186" height="92" rx="10" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="381" y="268" font-size="12.5" fill="#334155" text-anchor="middle">dispatch +</text>
  <text x="381" y="286" font-size="12.5" fill="#334155" text-anchor="middle">hermetic driver</text>
  <text x="381" y="304" font-size="12.5" fill="#334155" text-anchor="middle">policy</text>
  <rect x="486" y="230" width="186" height="92" rx="10" fill="#E0E7FF" stroke="#818CF8" stroke-width="1.5"/>
  <text x="579" y="262" font-size="12" font-weight="600" fill="#3730A3" text-anchor="middle">statically linked engine</text>
  <text x="579" y="282" font-size="12" fill="#334155" text-anchor="middle">Clang · LLD · llvm-ar</text>
  <text x="579" y="302" font-size="11.5" fill="#64748B" text-anchor="middle">LLVM 22.1.8</text>

  <!-- profile registry -->
  <rect x="40" y="196" width="186" height="62" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="133" y="221" font-size="12.5" font-weight="600" fill="#065F46" text-anchor="middle">profile registry</text>
  <text x="133" y="239" font-size="10.5" fill="#047857" text-anchor="middle">triple · sysroot · contract</text>

  <!-- sysroot overlays -->
  <rect x="40" y="274" width="186" height="62" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="133" y="299" font-size="12.5" font-weight="600" fill="#065F46" text-anchor="middle">sysroot overlays</text>
  <text x="133" y="317" font-size="10.5" fill="#047857" text-anchor="middle">optional vendor roots</text>

  <!-- external SDKs -->
  <rect x="734" y="224" width="186" height="84" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="827" y="250" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">external SDKs</text>
  <text x="827" y="268" font-size="10.5" fill="#475569" text-anchor="middle">Apple · Windows / MSVC</text>
  <text x="827" y="288" font-size="10.5" font-style="italic" fill="#64748B" text-anchor="middle">discovered, never packed</text>

  <!-- pack -->
  <rect x="135" y="404" width="190" height="70" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="230" y="432" font-size="12.5" font-weight="600" fill="#92400E" text-anchor="middle">embedded .rccpack</text>
  <text x="230" y="450" font-size="10.5" fill="#B45309" text-anchor="middle">headers · sysroots · compiler-rt</text>

  <!-- cache -->
  <rect x="433" y="404" width="192" height="70" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="529" y="432" font-size="12.5" font-weight="600" fill="#92400E" text-anchor="middle">content-addressed cache</text>
  <text x="529" y="450" font-size="10.5" fill="#B45309" text-anchor="middle">immutable read-only view</text>

  <!-- output -->
  <rect x="362" y="556" width="240" height="64" rx="12" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2"/>
  <text x="482" y="583" font-size="13.5" font-weight="600" fill="#155E75" text-anchor="middle">verified artifact</text>
  <text x="482" y="601" font-size="11" fill="#0E7490" text-anchor="middle">ELF · PE/COFF · Mach-O</text>
</svg>
